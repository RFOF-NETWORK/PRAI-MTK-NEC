<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PRAI-MTK-NEC — Web Interface</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;margin:2rem}input{padding:0.5rem}button{padding:0.5rem}</style>
</head>
<body>
  <h1>PRAI/MTK/NEC — Web Interface (KMP JS)</h1>
  <p>This web UI loads the Kotlin/JS shared module and exposes QPPS genesis and IBAN validation.</p>

  <div>
    <h2>Genesis</h2>
    <button id="gen">Compute Genesis</button>
    <pre id="genout"></pre>
  </div>

  <div>
    <h2>IBAN Validator</h2>
    <input id="iban" placeholder="DE89370400440532013000" style="width:60%">
    <button id="check">Validate</button>
    <pre id="ibanout"></pre>
  </div>

  <script src="/shared.bundle.js"></script>
  <script>
    // Assume shared exposes global org_rfof_shared_QppsGenesis with computeGenesis
    function runGenesis(){
      try{
        const g = org.rfof.shared.QppsGenesis.computeGenesis();
        document.getElementById('genout').textContent = JSON.stringify(g,['genesisId','e8Points','matrixSize','rounds','signature'],2);
      }catch(e){document.getElementById('genout').textContent = 'Error: '+e}
    }
    document.getElementById('gen').onclick = runGenesis;

    document.getElementById('check').onclick = ()=>{
      const v=document.getElementById('iban').value;
      try{
        const ok = org.rfof.shared.IbanValidator.isValid(v);
        document.getElementById('ibanout').textContent = ok? 'VALID':'INVALID';
      }catch(e){document.getElementById('ibanout').textContent = 'Error: '+e}
    }
  </script>
</body>
</html>
