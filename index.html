<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PRAI-MTK-NEC — Web Interface</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;margin:2rem}input{padding:0.5rem}button{padding:0.5rem}</style>
</head>
<body>
  <h1>PRAI/MTK/NEC — Web Interface (KMP JS)</h1>
  <p>This web UI loads the Kotlin/JS shared module and exposes QPPS genesis and IBAN validation.</p>

  <div>
    <h2>Genesis</h2>
    <button id="gen">Compute Genesis</button>
    <pre id="genout"></pre>
  </div>

  <div>
    <h2>IBAN Validator</h2>
    <input id="iban" placeholder="DE89370400440532013000" style="width:60%">
    <button id="check">Validate</button>
    <pre id="ibanout"></pre>
  </div>

  <script>
    // Attempt to load the Kotlin/JS bundle from common build locations.
    (function(){
      const candidates = [
        '/shared.bundle.js',
        '/shared/build/js/packages/shared/kotlin/shared.js',
        '/shared/build/distributions/shared.js',
        '/build/js/packages/shared/kotlin/shared.js'
      ];
      function loadScript(url, onload, onerror){
        const s = document.createElement('script');
        s.src = url; s.async = false;
        s.onload = onload; s.onerror = onerror;
        document.head.appendChild(s);
      }
      let idx = 0;
      function tryNext(){
        if(idx >= candidates.length){
          document.body.insertAdjacentHTML('beforeend','<p style="color:red">Could not find the Kotlin/JS bundle. Please build shared module and copy the JS bundle to one of the known locations listed in the docs.</p>');
          return;
        }
        const url = candidates[idx++];
        loadScript(url, ()=>{ document.dispatchEvent(new CustomEvent('kmp-bundle-loaded')); }, ()=>{ tryNext(); });
      }
      tryNext();
    })();
  </script>

  <script>
    document.addEventListener('kmp-bundle-loaded', ()=>{
      try{
        const g = org.rfof.shared.QppsGenesis.computeGenesis();
        document.getElementById('genout').textContent = JSON.stringify({ genesisId:g.genesisId, e8Points:g.e8Points, matrixSize:g.matrixSize, rounds:g.rounds, signature:g.signature }, null, 2);
      }catch(e){document.getElementById('genout').textContent = 'Error: '+e}

      document.getElementById('check').onclick = ()=>{
        const v=document.getElementById('iban').value;
        try{
          const ok = org.rfof.shared.IbanValidator.isValid(v);
          document.getElementById('ibanout').textContent = ok? 'VALID':'INVALID';
        }catch(e){document.getElementById('ibanout').textContent = 'Error: '+e}
      }
    });
  </script>
</body>
</html>
